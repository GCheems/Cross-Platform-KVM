[package]
name = "cross-platform-kvm"
version = "0.1.0"
edition = "2021"
authors = ["KVM Team"]
description = "Cross-platform keyboard, video, and mouse sharing system"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-rustls = "0.25"
rustls = "0.22"
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"
futures = "0.3"
arboard = "3.3"
sha2 = "0.10"
image = "0.24"
dirs = "5.0"
hostname = "0.3"
tauri = { version = "1.5", features = ["shell-open", "system-tray"] }
tauri-runtime = "0.14"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
winapi = { version = "0.3", features = ["securitybaseapi", "processthreadsapi", "winnt"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
core-foundation = "0.9"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dev-dependencies]
proptest = "1.4"
tokio-test = "0.4"
tempfile = "3.8"

[lib]
name = "cross_platform_kvm"
path = "src/lib.rs"

[[bin]]
name = "kvm"
path = "src/main.rs"

[[bin]]
name = "kvm-ui"
path = "src/tauri_main.rs"
